name: Publish to PyPI

# 一次性配置见 docs/DISTRIBUTION.md。默认手动触发，避免仓库刚公开时
# 每次 GitHub Release 都因为 PyPI 还没配置而变红。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.7.1）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shifang37-vagent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - name: Tag 与包版本必须一致
        run: python scripts/check_release_version.py "${{ inputs.tag }}"
      - run: python -m build --no-isolation --outdir dist/python
      - name: 发布到 PyPI（Trusted Publishing，无需 token）
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
