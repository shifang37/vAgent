[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "shifang37-vagent"
version = "0.7.1"
description = "DeepSeek video creation agent with a custom LangGraph harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "shifang37" }]
keywords = ["agent", "video", "langgraph", "deepseek", "short-drama", "ffmpeg", "storyboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langchain-deepseek>=1.0,<2",
  "langchain-core>=1.4.7,<2",
  "httpx>=0.28,<1",
  "httpcore>=1.0.9,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "redis>=5,<6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "mcp>=1.12,<2",
  "jsonschema>=4.23,<5",
  "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "build>=1.2,<2", "hatchling>=1.27,<2", "fonttools>=4.50,<5"]

[project.scripts]
vagent = "vagent.cli:main"

[project.urls]
Homepage = "https://github.com/shifang37/vAgent"
Repository = "https://github.com/shifang37/vAgent"
Issues = "https://github.com/shifang37/vAgent/issues"
Documentation = "https://github.com/shifang37/vAgent/blob/master/docs/USER_GUIDE.md"
Install = "https://github.com/shifang37/vAgent/blob/master/docs/DISTRIBUTION.md"

[tool.hatch.build.targets.wheel]
packages = ["src/vagent"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "vagent/builtin_skills"
"web" = "vagent/web"

[tool.hatch.build.targets.sdist]
include = [
  "/src/vagent",
  "/skills",
  "/web",
  "/tests",
  "/scripts",
  "/docs/*.md",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/requirements-dev.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
